services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r_core
    restart: always
    ports:
      - "3000:3000"
      - "5000:5000/tcp"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "DATABASE_URL='${DATABASE_URL}' npx prisma migrate deploy && node dist/main.js"

  postgres:
    image: postgres:15-alpine
    container_name: r_core_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PORT: ${API_PORT:-3000}
        TCP_PORT: ${TCP_PORT:-5000}
    container_name: r_core
    restart: always
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
      - "${TCP_PORT:-5000}:${TCP_PORT:-5000}/tcp"

    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=${API_PORT:-3000}
      - TCP_PORT=${TCP_PORT:-5000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_HOST:-45239}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "DATABASE_URL='${DATABASE_URL}' npx prisma migrate deploy && node dist/main.js"

  postgres:
    image: postgres:15-alpine
    container_name: r_core_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
  
  redis:
    image: redis:7-alpine
    container_name: r_core_redis
    restart: always
    ports:
      - "45239:45239"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: